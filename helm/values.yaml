# Values for the agent-stack-k8s controller (chart 0.50.0, release
# agent-stack-k8s in namespace buildkite). The agent token is not stored here;
# upgrade with --reuse-values to keep the agentToken already set on the release.
# See helm/README.md.

# Lets the k8s-monitoring Alloy collector find and scrape the controller's
# Prometheus metrics (its annotation autodiscovery). The job label matches what
# the Buildkite infrastructure dashboard queries.
annotations:
  k8s.grafana.com/scrape: "true"
  k8s.grafana.com/metrics.portNumber: "9216"
  k8s.grafana.com/job: buildkite/agent-stack-k8s

config:
  queue: kube
  max-in-flight: 10

  # Job pods run agent v4, which ignores the tracing-backend and
  # tracing-service-name settings here (they set BUILDKITE_TRACING_BACKEND).
  # Tracing is turned on with env vars on the agent container instead.
  agent-config:
    tracing-propagate-traceparent: true

  # OTLP exporter settings for the bootstrap that runs checkout and commands.
  default-checkout-params:
    envFrom:
      - configMapRef:
          name: buildkite-otel-env
  default-command-params:
    envFrom:
      - configMapRef:
          name: buildkite-otel-env

  pod-spec-patch:
    serviceAccountName: buildkite-agent
    automountServiceAccountToken: true
    containers:
      - name: agent
        envFrom:
          - configMapRef:
              name: buildkite-otel-env
        env:
          - name: BUILDKITE_OPENTELEMETRY_TRACING
            value: "true"
          - name: BUILDKITE_TELEMETRY_SERVICE_NAME
            value: buildkite-agent
          - name: BUILDKITE_JOB_LOGS_OTLP
            value: "true"
          - name: K8S_POD_UID
            valueFrom:
              fieldRef:
                fieldPath: metadata.uid
