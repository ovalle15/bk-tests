# grafana-community/tempo 3.2.0 (Tempo 3.1), single binary. Stores the spans
# that otel-gateway forwards, and turns them into metrics for Prometheus.
# TraceQL metrics queries (quantile_over_time etc.) need no extra processor in
# Tempo 3; the live-store and backend serve them.

tempo:
  reportingEnabled: false
  retention: 168h

  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      memory: 1Gi

  metricsGenerator:
    enabled: true
    remoteWriteUrl: http://prometheus-server.observability.svc.cluster.local/api/v1/write
    processor:
      # Duration histograms and call counts per span, written to Prometheus as
      # traces_spanmetrics_*. Resource attributes listed here become labels
      # (dots turn into underscores, e.g. buildkite_pipeline).
      span_metrics:
        dimensions:
          - buildkite.pipeline
          - buildkite.job_label
          - buildkite.queue
          - buildkite.branch
        histogram_buckets: [0.05, 0.1, 0.25, 0.5, 1, 2.5, 5, 10, 30, 60, 120, 300, 600]
    storage:
      path: /var/tempo/generator/wal

  # TraceQL metrics queries are capped at 24h by default; match the retention so
  # the Buildkite CI dashboard works over any range up to 7 days.
  queryFrontend:
    metrics:
      max_duration: 168h

  overrides:
    defaults:
      metrics_generator:
        processors:
          - span-metrics

persistence:
  enabled: true
  storageClassName: local-path
  size: 5Gi
