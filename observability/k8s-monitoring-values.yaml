# grafana/k8s-monitoring 4.5.3, release grafana-cloud in namespace monitoring.
# Grafana Cloud's supported Kubernetes setup: Alloy collectors that fetch their
# pipelines from Grafana Cloud Fleet Management, plus the services that feed
# them. Generated by the Grafana Cloud Kubernetes onboarding; see
# observability/README.md.
#
# Credentials are not in this file. They come from the grafana-cloud-remote-cfg
# Secret (keys: username = stack instance ID, password = access policy token),
# created by hand. The same token is what Fleet Management pipelines use to
# write data (the chart passes it to Alloy as GCLOUD_RW_API_KEY).

cluster:
  name: my-cluster

collectorCommon:
  alloy:
    remoteConfig:
      enabled: true
      url: https://fleet-management-prod-008.grafana.net
      auth:
        type: basic
        usernameKey: username
        passwordKey: password
      secret:
        create: false
        name: grafana-cloud-remote-cfg
      # With an external Secret the chart would also read TLS ca/cert/key
      # entries from it. Grafana Cloud needs none of them, so drop the block.
      tls: null

collectors:
  alloy:
    presets:
      - large
      - root
      - host-network
      - host-storage
      - host-cgroup
      - clustered
      - service-discovery
      - filesystem-log-reader
      - daemonset
      - otel-receiver
    # OTLP endpoint for applications (and Buildkite job pods):
    # grafana-cloud-otel-receiver.monitoring.svc.cluster.local:4317 (gRPC) / :4318 (HTTP)
    extraService:
      enabled: true
      name: otel-receiver

# Fleet Management doesn't offer an OTLP pipeline, so receiving application
# telemetry (Buildkite job pods' traces and logs) is configured here instead.
# It runs on the same Alloy collector, next to the Fleet Management pipelines.
applicationObservability:
  enabled: true
  collector: alloy
  destinations: [grafanaCloudOtlp]
  receivers:
    otlp:
      grpc:
        enabled: true
      http:
        enabled: true

destinations:
  grafanaCloudOtlp:
    type: otlp
    url: https://otlp-gateway-prod-us-east-2.grafana.net/otlp
    protocol: http
    # Username = stack instance ID (not secret). The password is the same token
    # Fleet Management uses, which the chart already passes to Alloy as
    # GCLOUD_RW_API_KEY from the grafana-cloud-remote-cfg Secret; it needs
    # metrics, logs and traces write scopes. embed: true stops the chart from
    # creating or reading a Secret for this destination.
    auth:
      type: basic
      username: "1884458"
      passwordFrom: sys.env("GCLOUD_RW_API_KEY")
    secret:
      embed: true

telemetryServices:
  node-exporter:
    deploy: true

  kube-state-metrics:
    deploy: true

  beyla:
    deploy: true
    k8sCache:
      replicas: 1

  opencost:
    deploy: false

  sdkInjector:
    deploy: true
    allowedConfigMapWriters: system:serviceaccount:monitoring:grafana-cloud-alloy
