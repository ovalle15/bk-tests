# grafana-community/grafana 14.0.1 (Grafana 13.2). The admin password is generated by
# the chart into the grafana Secret; see observability/README.md.

persistence:
  enabled: true
  storageClassName: local-path
  size: 1Gi

# The opentelemetry-demo release (my-otel-demo, namespace default) already owns
# the cluster-scoped grafana-clusterrole. A namespaced Role avoids the clash.
rbac:
  namespaced: true

resources:
  requests:
    cpu: 50m
    memory: 128Mi
  limits:
    memory: 512Mi

ingress:
  enabled: true
  ingressClassName: traefik
  # nip.io resolves this name to 127.0.0.1 only. grafana.localhost resolves to
  # ::1 first, where Docker Desktop holds port 80, so browsers never reach Traefik.
  hosts:
    - grafana.127.0.0.1.nip.io

testFramework:
  enabled: false

# Loads dashboards from ConfigMaps labelled grafana_dashboard in this
# namespace, into a "Buildkite" folder. See observability/README.md.
sidecar:
  dashboards:
    enabled: true
    label: grafana_dashboard
    resource: configmap
    provider:
      folder: Buildkite

datasources:
  datasources.yaml:
    apiVersion: 1
    datasources:
      - name: Tempo
        uid: tempo
        type: tempo
        url: http://tempo.observability.svc.cluster.local:3200
        isDefault: true
        jsonData:
          # Span -> its log lines. Loki keeps trace_id as structured metadata.
          tracesToLogsV2:
            datasourceUid: loki
            customQuery: true
            query: '{service_name="buildkite-agent"} | trace_id="$${__trace.traceId}"'
            spanStartTimeShift: -5m
            spanEndTimeShift: 5m
          tracesToMetrics:
            datasourceUid: prometheus
          serviceMap:
            datasourceUid: prometheus
          nodeGraph:
            enabled: true
      - name: Loki
        uid: loki
        type: loki
        url: http://loki.observability.svc.cluster.local:3100
        jsonData:
          # Log line -> its trace in Tempo.
          derivedFields:
            - name: TraceID
              matcherType: label
              matcherRegex: trace_id
              datasourceUid: tempo
              url: "$${__value.raw}"
      - name: Prometheus
        uid: prometheus
        type: prometheus
        url: http://prometheus-server.observability.svc.cluster.local
