services:
  otel-collector:
    image: otel/opentelemetry-collector
    volumes:
      - ./otel-collector-config.yaml:/etc/otelcol/config.yaml
    ports:
      - 1888:1888 # pprof extension
      - 8888:8888 # Prometheus metrics exposed by the Collector
      - 8889:8889 # Prometheus exporter metrics
      - 13133:13133 # health_check extension
      - 4317:4317 # OTLP gRPC receiver
      - 4318:4318 # OTLP http receiver
      - 55679:55679 # zpages extension
  app:
    image: packages.buildkite.com/spacecamp/nasa-image/server:latest
    pull_policy: always
    container_name: bk_app
    ports:
      - "8080:80"
    environment:
      BUILDKITE_OPENTELEMETRY_TRACING: true 
      BUILDKITE_TELEMETRY_SERVICE_NAME: "buildkite-agent"
      OTEL_EXPORTER_OTLP_ENDPOINT: "http://otel-collector:4317"
      OTEL_EXPORTER_OTLP_PROTOCOL: "grpc"
    depends_on:
      - server
      - otel-collector
    networks:
      - app-network
      - buildkite-otel

  server:
    image: packages.buildkite.com/spacecamp/nasa-image/server:latest
    pull_policy: always
    container_name: bk_server
    command: npm start
    volumes:
      - ./server/:/usr/src/app
      - /usr/src/app/node_modules
    ports:
      - "3000:3000"
    environment:
      APP_ENV: "${APP_ENV:-test}"
      API_HOST: "${API_HOST:-localhost}"
      PORT: "${PORT:-3000}"
      API_TOKEN: "${API_TOKEN}"
      BUILDKITE_OPENTELEMETRY_TRACING: true 
      BUILDKITE_TELEMETRY_SERVICE_NAME: "buildkite-agent"
      OTEL_EXPORTER_OTLP_ENDPOINT: "http://otel-collector:4317"
      OTEL_EXPORTER_OTLP_PROTOCOL: "grpc"
    networks:
      - app-network
      - buildkite-otel

networks:
    app-network:
        driver: bridge
    buildkite-otel:
        driver: bridge

volumes:
    data-volume:
    node_modules:
    web-root:
      driver: local
 