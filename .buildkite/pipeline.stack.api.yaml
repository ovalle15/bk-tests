env:
  PIPELINE_VERSION: "1.0.0"
  ENVIRONMENT: "stage"
  
steps:
  - label: ":hammer: Setup"
    key: setup
    command:
      - echo "Preparing dummy environment..."
      - echo "Dependencies installed successfully"
  
  - label: ":satellite: Record Buildkite cluster"
    key: record-cluster
    command:
      - buildkite-agent meta-data set \
          "dd_tags.buildkite_cluster_id" \
          "$BUILDKITE_CLUSTER_ID"
  
  - label: " :bar_chart: Metrics"
    key: metrics
    command: buildkite-agent meta-data set "dd_measures.test_count" 42
    
  - label: ":test_tube: Run tests"
    key: test
    command: echo "Running dummy tests..." && exit 0
    depends_on: ["setup"]

  - label: ":rocket: Deploy"
    command: echo "Deploying dummy application..." && exit 0
    depends_on: ["test"]
    branches: "main"
  
  - label: ":wave: Finish"
    command: echo "Pipeline finished successfully. Pipeline version: $PIPELINE_VERSION. Environment: $ENVIRONMENT" && exit 0
    depends_on: ["deploy"]
