# Buildkite 101 demo: "From Commit to Green Build"
# Every job runs on the Buildkite hosted macOS queue (Apple silicon, ephemeral).

agents:
  queue: "macos-medium"

steps:
  - label: ":apple: Hosted agent info"
    command: demo/annotations/agent-info.sh

  - label: ":python: Lint"
    key: "lint"
    command: python3 -m py_compile demo/api/server.py demo/tests/test_api.py

  - label: ":test_tube: API tests"
    key: "api-tests"
    depends_on: "lint"
    parallelism: 3
    env:
      PYTHON_COLORS: "0"
    command:
      - python3 demo/api/server.py &
      - sleep 2
      - python3 demo/tests/run.py demo/reports
    artifact_paths: "demo/reports/*"

  - label: ":package: Build"
    key: "build"
    depends_on: "lint"
    command: tar -czf notes-api.tar.gz demo/api
    artifact_paths: "notes-api.tar.gz"

  - block: ":rocket: Deploy to staging?"
    key: "approval"
    depends_on:
      - "api-tests"
      - "build"

  - label: ":rocket: Deploy (staging)"
    depends_on: "approval"
    concurrency: 1
    concurrency_group: "ao-demo/deploy/staging"
    command:
      - buildkite-agent artifact download notes-api.tar.gz .
      - echo "Deploying notes-api.tar.gz to staging..."
      - 'buildkite-agent annotate ":rocket: **Deployed to staging.** Approved by $$BUILDKITE_UNBLOCKER" --style success --context deploy'
