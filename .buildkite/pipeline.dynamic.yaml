steps:
  - label: ":mag: Validate queue routing"
    key: validate-queue-routing
    command: python3 scripts/queue_router.py validate
      
  - label: ":python: Generate pipeline"
    key: generate-pipeline
    command: |
      set -euo pipefail
      python3 scripts/queue_router.py validate
      python3 scripts/generate_pipeline.py > /tmp/pipeline-"$$BUILDKITE_JOB_ID".json
      {
        printf '### Generated dynamic pipeline\n\n'
        printf 'File on the agent running this job: `/tmp/pipeline-%s.json`\n\n' "$$BUILDKITE_JOB_ID"
        printf '```json\n'
        cat /tmp/pipeline-"$$BUILDKITE_JOB_ID".json
        printf '\n```\n'
      } | buildkite-agent annotate --context dynamic-pipeline --style info
      buildkite-agent pipeline upload --no-interpolation /tmp/pipeline-"$$BUILDKITE_JOB_ID".json
